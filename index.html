<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#E60000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>DUMELHOR — Encomendas</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --red: #E60000; --red-d: #B30000;
            --dark: #1A1A1A; --grey: #333;
            --mid: #666; --light: #F5F5F5;
            --border: #E0E0E0; --green: #00A651;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        html { scroll-padding-top: 52px; }
        body { font-family: 'Montserrat', sans-serif; background: var(--light); color: var(--grey); overflow-x: hidden; touch-action: manipulation; -webkit-text-size-adjust: 100%; }

        /* ══════════════════════════════
           HEADER
           ══════════════════════════════ */
        header {
            position: fixed; top: 0; left: 0; right: 0; z-index: 3000;
            height: 52px; background: var(--red);
            display: flex; align-items: center; gap: 8px; padding: 0 10px;
            box-shadow: 0 2px 10px rgba(230,0,0,0.35);
        }

        /* ☰  — abre grelha de marcas */
        .btn-hamburger {
            width: 40px; height: 40px; flex-shrink: 0;
            background: transparent; border: none; cursor: pointer;
            color: white; font-size: 26px; line-height: 1;
            display: flex; align-items: center; justify-content: center;
            border-radius: 8px; padding: 0;
        }
        .btn-hamburger:active { background: rgba(255,255,255,0.15); }

        /* Botão logo — só imagem, sem função de marcas */
        .btn-logo {
            width: 40px; height: 40px; flex-shrink: 0;
            border-radius: 9px; overflow: hidden;
            background: white; border: none; cursor: default;
            display: flex; align-items: center; justify-content: center;
            padding: 3px;
        }
        .btn-logo img { width: 100%; height: 100%; object-fit: contain; display: block; }
        .btn-logo span { font-size: 8px; font-weight: 900; color: var(--red); text-align: center; line-height: 1.1; }

        /* Pesquisa */
        .search-wrap { flex: 1; position: relative; display: flex; align-items: center; }
        .search-wrap input {
            flex: 1; height: 34px; border: none; border-radius: 20px;
            padding: 0 30px 0 12px; font-size: 12px; font-weight: 600;
            font-family: 'Montserrat', sans-serif; background: white; color: var(--grey); outline: none;
        }
        .search-wrap input::placeholder { color: #B0B0B0; font-weight: 500; }
        .btn-clear-search {
            position: absolute; right: 8px; background: none; border: none;
            cursor: pointer; color: #B0B0B0; font-size: 16px; display: none; padding: 2px;
        }

        /* Carrinho */
        .cart-btn {
            position: relative; width: 38px; height: 38px; flex-shrink: 0;
            background: white; border-radius: 10px; border: none; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 18px; color: var(--red); box-shadow: 0 2px 6px rgba(0,0,0,0.12);
        }
        .cart-btn:active { transform: scale(0.9); }
        .cart-badge {
            position: absolute; top: -5px; right: -5px;
            background: var(--green); color: white;
            min-width: 17px; height: 17px; border-radius: 50%;
            font-size: 9px; font-weight: 800;
            display: none; align-items: center; justify-content: center;
            border: 2px solid white; z-index: 1;
        }

        /* ══════════════════════════════
           GRELHA DE MARCAS — desce do topo
           igual ao DUMELHOR original
           ══════════════════════════════ */
        .marcas-container {
            position: fixed; left: 0; right: 0;
            top: -110%;                      /* escondida acima */
            max-height: calc(100vh - 52px);
            background: #1A1A1A;
            border-bottom: 2px solid rgba(255,255,255,0.1);
            z-index: 4000;
            overflow-y: auto; overflow-x: hidden;
            transition: top 0.15s ease-out;
            box-shadow: 0 8px 30px rgba(0,0,0,0.6);
            /* padding-top = altura do header para não ficar por baixo */
            padding: 60px 10px 14px;
        }
        .marcas-container.aberto { top: 0; }

        /* Overlay escuro para fechar ao clicar fora */
        .marcas-overlay {
            position: fixed; inset: 0; z-index: 3950;
            display: none; background: transparent;
        }
        .marcas-overlay.aberto { display: block; }

        /* Barra de pesquisa de marcas */
        .marcas-search {
            display: flex; gap: 8px; align-items: center; margin-bottom: 10px;
        }
        .marcas-search input {
            flex: 1; height: 36px; border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.15);
            background: rgba(255,255,255,0.09); color: white;
            padding: 0 12px; font-size: 12px; font-weight: 600;
            font-family: 'Montserrat', sans-serif; outline: none;
        }
        .marcas-search input::placeholder { color: rgba(255,255,255,0.3); }
        .btn-fechar-marcas {
            width: 36px; height: 36px; flex-shrink: 0; border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.07);
            color: rgba(255,255,255,0.6); font-size: 18px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }

        /* Grelha: 4 col mobile, 6 col landscape */
        .marcas-grid {
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
        }
        @media (orientation: landscape) and (min-width: 600px) {
            .marcas-grid { grid-template-columns: repeat(6, 1fr); }
        }

        /* Cada botão de marca — só imagem (logótipo), sem texto */
        .marca-btn {
            aspect-ratio: 1/1; border-radius: 10px;
            border: 1.5px solid rgba(255,255,255,0.1);
            background: white; cursor: pointer; overflow: hidden;
            display: flex; align-items: center; justify-content: center;
            padding: 6px; transition: all 0.1s;
        }
        .marca-btn:active { transform: scale(0.93); }
        .marca-btn.ativo {
            border-color: var(--red); border-width: 2.5px;
            box-shadow: 0 0 10px rgba(230,0,0,0.45);
        }
        .marca-btn img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
        /* fallback quando não há imagem: inicial da marca */
        .marca-inicial {
            font-size: 20px; font-weight: 900; color: var(--red); line-height: 1;
        }

        /* Rodapé do menu marcas */
        .marcas-footer {
            margin-top: 10px; padding-top: 10px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }
        .btn-todas {
            width: 100%; height: 38px; border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.65);
            font-family: 'Montserrat', sans-serif; font-size: 11px; font-weight: 700;
            cursor: pointer; letter-spacing: 0.5px;
        }

        /* ══════════════════════════════
           CHIP de filtro ativo
           ══════════════════════════════ */
        .filtro-chip {
            display: none; margin: 8px 10px 0;
            background: var(--red); color: white;
            padding: 5px 10px 5px 12px; border-radius: 20px;
            font-size: 11px; font-weight: 700;
            align-items: center; gap: 6px; width: fit-content;
        }
        .filtro-chip.show { display: flex; }
        .filtro-chip button {
            background: none; border: none; cursor: pointer;
            color: rgba(255,255,255,0.8); font-size: 15px; line-height: 1; padding: 0;
        }

        /* ══════════════════════════════
           LOJA
           ══════════════════════════════ */
        main { padding: 52px 0 120px; min-height: 100vh; }

        .fam-header {
            background: white; border: 1px solid var(--border); border-radius: 8px;
            margin: 6px 10px 0; padding: 9px 14px;
            display: flex; justify-content: space-between; align-items: center;
            font-size: 11px; font-weight: 700; letter-spacing: 0.8px;
            text-transform: uppercase; cursor: pointer; user-select: none;
            box-shadow: 0 1px 4px rgba(0,0,0,0.04); color: var(--grey);
        }
        .fam-header:active { background: var(--light); }
        .fam-arrow { color: #B0B0B0; font-weight: 400; transition: transform 0.15s; }
        .fam-arrow.open { transform: rotate(180deg); }
        .fam-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 8px 10px; }
        .fam-grid.hidden { display: none; }
        @media (orientation: landscape) and (min-width: 600px) {
            .fam-grid { grid-template-columns: repeat(4,1fr); }
        }

        /* Card produto */
        .card-pro {
            background: white; border-radius: 10px; padding: 8px; text-align: center;
            border: 1px solid var(--border); position: relative;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05); cursor: pointer;
            transition: transform 0.1s;
        }
        .card-pro:active { transform: scale(0.97); opacity: 0.85; }
        .card-pro-img {
            width: 100%; aspect-ratio: 1/1; object-fit: contain;
            background: white; border-radius: 8px; display: block; margin-bottom: 6px;
        }
        .card-pro-img.ph { display: flex; align-items: center; justify-content: center; font-size: 32px; background: var(--light); }
        .card-pro-nome { font-size: 10px; font-weight: 600; height: 26px; overflow: hidden; line-height: 1.2; margin-bottom: 4px; color: var(--grey); text-align: left; }
        .card-pro-preco { color: var(--red); font-weight: 400; font-size: 13px; text-align: center; margin-top: 4px; }
        .card-pro-un { font-size: 9px; color: var(--mid); font-weight: 500; text-align: center; }
        .b-qty {
            position: absolute; top: 5px; right: 5px;
            background: var(--red); color: white;
            width: 22px; height: 22px; border-radius: 50%;
            display: none; align-items: center; justify-content: center;
            font-weight: 800; font-size: 11px; border: 2px solid white;
            box-shadow: 0 1px 5px rgba(230,0,0,0.4); z-index: 5;
        }
        .b-qty.show { display: flex; }

        .sem-resultados { text-align: center; padding: 50px 20px; display: none; color: var(--mid); }
        .sem-resultados.show { display: block; }
        .sem-resultados .em { font-size: 48px; margin-bottom: 12px; }
        .sem-resultados h3 { font-size: 16px; font-weight: 700; margin-bottom: 6px; color: var(--grey); }

        /* ══════════════════════════════
           MODAL QUANTIDADE
           ══════════════════════════════ */
        .modal-bg { position: fixed; inset: 0; z-index: 8000; background: rgba(0,0,0,0.85); display: none; align-items: center; justify-content: center; }
        .modal-bg.open { display: flex; }
        .modal-box { background: #1A1A1A; border: 1px solid rgba(255,255,255,0.12); border-radius: 18px; padding: 24px 20px; width: min(92vw,360px); text-align: center; }
        .modal-img { width: 80px; height: 80px; border-radius: 10px; object-fit: contain; background: white; margin: 0 auto 12px; display: block; }
        .modal-nome { color: white; font-size: 15px; font-weight: 800; margin-bottom: 4px; line-height: 1.3; }
        .modal-preco { color: rgba(255,255,255,0.5); font-size: 13px; margin-bottom: 20px; }
        .qty-controls { display: flex; align-items: center; justify-content: center; gap: 16px; margin-bottom: 20px; }
        .btn-qty { width: 50px; height: 50px; border-radius: 50%; border: 2px solid white; background: rgba(255,255,255,0.12); color: white; font-size: 28px; font-weight: 900; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .btn-qty:active { background: rgba(255,255,255,0.25); }
        .qty-input { width: 80px; text-align: center; font-size: 30px; font-weight: 900; border: 2px solid white; border-radius: 12px; background: rgba(255,255,255,0.08); color: white; padding: 8px; outline: none; font-family: 'Montserrat', sans-serif; }
        .modal-actions { display: flex; gap: 10px; }
        .btn-cancel { flex:1; padding:14px; border-radius:12px; border:2px solid rgba(255,255,255,0.2); background:transparent; color:white; font-size:13px; font-weight:700; cursor:pointer; font-family:'Montserrat',sans-serif; }
        .btn-add { flex:2; padding:14px; border-radius:12px; border:none; background:var(--red); color:white; font-size:14px; font-weight:800; cursor:pointer; font-family:'Montserrat',sans-serif; }
        .btn-add:active { background: var(--red-d); }
        .btn-remove { width:100%; padding:10px; border-radius:10px; border:1px solid rgba(255,255,255,0.1); background:rgba(255,255,255,0.04); color:rgba(255,255,255,0.4); font-size:12px; font-weight:600; cursor:pointer; font-family:'Montserrat',sans-serif; margin-bottom:10px; }

        /* ══════════════════════════════
           PAINEL CARRINHO
           ══════════════════════════════ */
        .cart-panel { position: fixed; inset: 0; z-index: 7000; background: white; display: none; flex-direction: column; }
        .cart-panel.open { display: flex; }
        .cart-header { background: var(--red); height: 52px; display: flex; align-items: center; gap: 10px; padding: 0 14px; flex-shrink: 0; box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
        .cart-header h2 { color: white; font-size: 15px; font-weight: 800; flex: 1; }
        .btn-back { width:34px; height:34px; border-radius:50%; border:none; background:rgba(255,255,255,0.2); color:white; font-size:18px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
        .cart-body { flex: 1; overflow-y: auto; background: var(--light); }
        .cart-footer { flex-shrink: 0; background: white; padding: 14px; border-top: 1px solid var(--border); box-shadow: 0 -2px 12px rgba(0,0,0,0.06); }

        .flbl { font-size:10px; font-weight:700; color:#B0B0B0; letter-spacing:1.2px; text-transform:uppercase; display:block; margin-bottom:4px; margin-top:10px; }
        .finp, .ftxt { width:100%; padding:11px 13px; background:var(--light); border:1.5px solid var(--border); border-radius:10px; font-size:14px; color:var(--grey); font-family:'Montserrat',sans-serif; outline:none; -webkit-appearance:none; }
        .finp:focus, .ftxt:focus { border-color:var(--red); background:white; }
        .ftxt { resize:none; height:70px; }

        .total-strip { display:flex; justify-content:space-between; align-items:center; background:var(--light); border-radius:10px; padding:12px 14px; margin:12px 0 10px; border:1px solid var(--border); }
        .total-lbl { font-size:11px; font-weight:700; color:var(--mid); letter-spacing:0.5px; }
        .total-val { font-size:24px; font-weight:900; color:var(--red); }
        .total-items { font-size:11px; color:var(--mid); }

        .envio-btns { display:flex; flex-direction:column; gap:8px; }
        .btn-wpp { width:100%; padding:15px; border-radius:14px; border:none; background:#25D366; color:white; font-size:15px; font-weight:900; cursor:pointer; font-family:'Montserrat',sans-serif; display:flex; align-items:center; justify-content:center; gap:8px; }
        .btn-wpp:active { background:#1ea952; }
        .btn-eml { width:100%; padding:13px; border-radius:14px; border:1.5px solid var(--border); background:white; color:var(--grey); font-size:14px; font-weight:700; cursor:pointer; font-family:'Montserrat',sans-serif; display:flex; align-items:center; justify-content:center; gap:8px; }
        .btn-eml:active { background:var(--light); }
        .btn-dis { opacity:0.45; pointer-events:none; }

        .cart-item { background:white; border-bottom:1px solid #F0F0F0; padding:10px 12px; display:flex; align-items:center; gap:10px; }
        .ci-img { width:48px; height:48px; border-radius:8px; flex-shrink:0; object-fit:contain; background:var(--light); border:1px solid var(--border); }
        .ci-info { flex:1; min-width:0; }
        .ci-nome { font-size:12px; font-weight:700; color:var(--grey); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .ci-preco { font-size:11px; color:var(--mid); margin-top:2px; }
        .ci-ctrl { display:flex; align-items:center; gap:6px; flex-shrink:0; }
        .bqs { width:28px; height:28px; border-radius:50%; border:1.5px solid var(--border); background:var(--light); color:var(--grey); font-size:16px; font-weight:700; cursor:pointer; display:flex; align-items:center; justify-content:center; }
        .bqs.del { border-color:#ffcccc; background:#fff5f5; color:#cc0000; }
        .qd { font-size:16px; font-weight:900; color:var(--grey); min-width:22px; text-align:center; }
        .cart-sec { padding:8px 12px; font-size:9px; font-weight:700; letter-spacing:1.2px; text-transform:uppercase; color:#B0B0B0; background:var(--light); border-bottom:1px solid var(--border); }
        .cart-empty { text-align:center; padding:60px 20px; color:var(--mid); }

        /* ══════════════════════════════
           SUCCESS
           ══════════════════════════════ */
        .success-screen { position:fixed; inset:0; z-index:9000; background:white; display:none; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:40px; }
        .success-screen.open { display:flex; }
        .success-screen .em { font-size:72px; margin-bottom:20px; }
        .success-screen h2 { font-size:22px; font-weight:900; color:var(--grey); margin-bottom:8px; }
        .success-screen p { font-size:14px; color:var(--mid); margin-bottom:30px; line-height:1.6; }
        .btn-nova { background:var(--red); color:white; border:none; border-radius:14px; padding:16px 32px; font-size:15px; font-weight:800; cursor:pointer; font-family:'Montserrat',sans-serif; }

        /* Loading */
        .loading-state { text-align:center; padding:60px 20px; color:var(--mid); }
        .spin { width:36px; height:36px; border:3px solid var(--border); border-top-color:var(--red); border-radius:50%; animation:spin .7s linear infinite; margin:0 auto 14px; }
        @keyframes spin { to { transform:rotate(360deg); } }

        /* Toast */
        .toast { position:fixed; bottom:80px; left:50%; transform:translateX(-50%); background:rgba(26,26,26,0.92); color:white; padding:10px 18px; border-radius:20px; font-size:13px; font-weight:600; z-index:9999; white-space:nowrap; opacity:0; transition:opacity .2s; pointer-events:none; }
        .toast.show { opacity:1; }

        /* Barra inferior */
        .bottom-bar { position:fixed; bottom:0; left:0; right:0; z-index:2500; background:white; border-top:1px solid var(--border); padding:8px 14px 10px; box-shadow:0 -2px 12px rgba(0,0,0,0.06); display:flex; align-items:center; gap:12px; }
        .bt-total { flex:1; }
        .bt-lbl { font-size:9px; font-weight:700; color:#B0B0B0; letter-spacing:1px; text-transform:uppercase; }
        .bt-val { font-size:20px; font-weight:900; color:var(--red); line-height:1; }
        .btn-ver-cart { background:var(--red); color:white; border:none; border-radius:12px; padding:12px 20px; font-size:13px; font-weight:800; cursor:pointer; font-family:'Montserrat',sans-serif; display:flex; align-items:center; gap:6px; white-space:nowrap; }
        .btn-ver-cart:active { background:var(--red-d); }
        .btn-ver-cart.hidden { display:none; }
    </style>
</head>
<body>

<div class="toast" id="toast"></div>

<!-- ══ HEADER ══ -->
<header>
    <!-- ☰ abre grelha de marcas -->
    <button class="btn-hamburger" onclick="toggleMarcas()" aria-label="Marcas">☰</button>

    <!-- Botão logo — só imagem, sem função de marcas -->
    <div class="btn-logo" id="btn-logo">
        <img src="images/logo.png" alt="DUMELHOR" onerror="this.style.display='none'; this.nextElementSibling.style.display='block'">
        <span style="display:none">DM</span>
    </div>

    <!-- Pesquisa -->
    <div class="search-wrap">
        <input type="text" id="in-busca" placeholder="Pesquisar produto..."
            oninput="filtrarProdutos(this.value)"
            onkeypress="if(event.key==='Enter') this.blur()">
        <button class="btn-clear-search" id="btn-clear" onclick="limparPesquisa()">✕</button>
    </div>

    <!-- Carrinho -->
    <button class="cart-btn" onclick="abrirCarrinho()">
        🛒<div class="cart-badge" id="cart-badge">0</div>
    </button>
</header>

<!-- ══ GRELHA DE MARCAS — desce do topo ══ -->
<!-- overlay fecha ao clicar fora -->
<div class="marcas-overlay" id="marcas-overlay" onclick="fecharMarcas()"></div>

<div class="marcas-container" id="marcas-container">
    <div class="marcas-search">
        <input type="text" id="in-marca" placeholder="🔍 Pesquisar marca..."
            oninput="renderMarcasGrid(this.value)">
        <button class="btn-fechar-marcas" onclick="fecharMarcas()">✕</button>
    </div>
    <div class="marcas-grid" id="marcas-grid">
        <!-- preenchido por JS -->
    </div>
    <div class="marcas-footer">
        <button class="btn-todas" onclick="selecionarMarca(null)">📦 VER TODOS OS PRODUTOS</button>
    </div>
</div>

<!-- ══ MAIN ══ -->
<main>
    <div class="filtro-chip" id="filtro-chip">
        <span id="filtro-nome"></span>
        <button onclick="selecionarMarca(null)">✕</button>
    </div>
    <div id="loja-container">
        <div class="loading-state"><div class="spin"></div><p style="font-size:13px;font-weight:600">A carregar produtos...</p></div>
    </div>
    <div class="sem-resultados" id="sem-res">
        <div class="em">🔍</div>
        <h3>Sem resultados</h3>
        <p>Tente outra pesquisa ou selecione outra marca.</p>
    </div>
</main>

<!-- Barra inferior -->
<div class="bottom-bar">
    <div class="bt-total">
        <div class="bt-lbl">Total carrinho</div>
        <div class="bt-val" id="bt-val">0,00 €</div>
    </div>
    <button class="btn-ver-cart hidden" id="btn-ver-cart" onclick="abrirCarrinho()">🛒 VER CARRINHO</button>
</div>

<!-- ══ MODAL QUANTIDADE ══ -->
<div class="modal-bg" id="modal-qty">
    <div class="modal-box">
        <img class="modal-img" id="modal-img" src="" alt="" onerror="this.style.display='none'">
        <div class="modal-nome" id="modal-nome"></div>
        <div class="modal-preco" id="modal-preco"></div>
        <button class="btn-remove" id="btn-remove-item" onclick="removerItem()">🗑 Remover do carrinho</button>
        <div class="qty-controls">
            <button class="btn-qty" onclick="ajustarQty(-1)">−</button>
            <input type="number" class="qty-input" id="qty-input" value="1" min="1" inputmode="numeric">
            <button class="btn-qty" onclick="ajustarQty(1)">+</button>
        </div>
        <div class="modal-actions">
            <button class="btn-cancel" onclick="fecharModal()">Cancelar</button>
            <button class="btn-add" onclick="confirmarQty()">✓ ADICIONAR</button>
        </div>
    </div>
</div>

<!-- ══ PAINEL CARRINHO ══ -->
<div class="cart-panel" id="cart-panel">
    <div class="cart-header">
        <button class="btn-back" onclick="fecharCarrinho()">←</button>
        <h2>🛒 CARRINHO</h2>
    </div>
    <div class="cart-body" id="cart-body"></div>
    <div class="cart-footer">
        <label class="flbl">O SEU NOME</label>
        <input type="text" class="finp" id="cli-nome" placeholder="Nome completo">
        <label class="flbl">TELEFONE (opcional)</label>
        <input type="text" class="finp" id="cli-tel" placeholder="Telefone">
        <label class="flbl">OBSERVAÇÕES (opcional)</label>
        <textarea class="ftxt" id="cli-obs" placeholder="Notas sobre a encomenda..."></textarea>
        <div class="total-strip">
            <div>
                <div class="total-lbl">TOTAL A PAGAR</div>
                <div class="total-items" id="total-items">0 artigos</div>
            </div>
            <div class="total-val" id="total-val">0,00 €</div>
        </div>
        <div class="envio-btns">
            <button class="btn-wpp" id="btn-wpp" onclick="enviar('wpp')">📲 ENVIAR POR WHATSAPP</button>
            <button class="btn-eml" id="btn-eml" onclick="enviar('email')">✉️ ENVIAR POR EMAIL</button>
        </div>
    </div>
</div>

<!-- ══ ECRÃ SUCESSO ══ -->
<div class="success-screen" id="success-screen">
    <div class="em">✅</div>
    <h2>Encomenda Enviada!</h2>
    <p>A sua encomenda foi enviada com sucesso.<br>Entraremos em contacto brevemente.</p>
    <button class="btn-nova" onclick="novaEncomenda()">🛒 Nova Encomenda</button>
</div>

<script>
// ══════════════════════════════
// CONFIGURAÇÃO
// ══════════════════════════════
const CONFIG = {
    whatsapp:     '351967925745',
    email:        'dumelhorlda@gmail.com',
    nomeLoja:     'DUMELHOR',
    produtosJson: 'produtos.json',
    imagesDir:    'images/',
};

// ══════════════════════════════
// ESTADO
// ══════════════════════════════
let DADOS = [], MARCAS = [], CART = {};
let MARCA_ATIVA = null, BUSCA = '', PROD_MODAL = null;
let FAM_EST = {}, MARCAS_ABERTO = false;

// ══════════════════════════════
// CARREGAR PRODUTOS
// ══════════════════════════════
async function carregarProdutos() {
    try {
        const r = await fetch(CONFIG.produtosJson + '?v=' + Date.now());
        if (!r.ok) throw new Error();
        DADOS = await r.json();
        // Marcas únicas, por ordem de aparecimento no JSON (preserva ordem do Excel)
        const seen = new Set();
        MARCAS = [];
        DADOS.forEach(p => {
            const m = (p.marca || '').trim();
            if (m && !seen.has(m)) { seen.add(m); MARCAS.push(m); }
        });
        renderMarcasGrid();
        renderLoja();
    } catch(e) {
        document.getElementById('loja-container').innerHTML =
            `<div style="text-align:center;padding:40px;color:#c00;">
                <div style="font-size:40px;margin-bottom:12px">⚠️</div>
                <b>Produtos não encontrados</b><br>
                <small style="color:#888;display:block;margin-top:8px;line-height:1.7">
                Crie o ficheiro <b>produtos.json</b> com o <b>admin.html</b><br>e coloque-o na mesma pasta no GitHub.
                </small>
             </div>`;
    }
}

// ══════════════════════════════
// GRELHA DE MARCAS
// ══════════════════════════════
function toggleMarcas() {
    MARCAS_ABERTO = !MARCAS_ABERTO;
    document.getElementById('marcas-container').classList.toggle('aberto', MARCAS_ABERTO);
    document.getElementById('marcas-overlay').classList.toggle('aberto', MARCAS_ABERTO);
    if (MARCAS_ABERTO) {
        document.getElementById('in-marca').value = '';
        renderMarcasGrid();
    }
}

function fecharMarcas() {
    MARCAS_ABERTO = false;
    document.getElementById('marcas-container').classList.remove('aberto');
    document.getElementById('marcas-overlay').classList.remove('aberto');
}

function renderMarcasGrid(filtro) {
    const grid = document.getElementById('marcas-grid');
    const lista = filtro
        ? MARCAS.filter(m => m.toLowerCase().includes(filtro.toLowerCase()))
        : MARCAS;

    if (!lista.length) {
        grid.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:20px;color:rgba(255,255,255,0.3);font-size:12px;font-weight:600;">Nenhuma marca encontrada</div>`;
        return;
    }

    grid.innerHTML = lista.map(marca => {
        // O ficheiro de imagem da marca deve chamar-se igual à marca em minúsculas
        // ex: marca "SUPER BOCK" → images/super-bock.png  OU  images/super bock.jpg
        const slug = marca.toLowerCase().replace(/\s+/g, '-');
        const slugS = marca.toLowerCase().replace(/\s+/g, '');
        const ativo = MARCA_ATIVA === marca ? ' ativo' : '';

        // Tenta .png depois .jpg depois sem espaços — onerror em cadeia
        const imgHtml = `<img
            src="${CONFIG.imagesDir}${slug}.png"
            onerror="this.src='${CONFIG.imagesDir}${slug}.jpg';
                     this.onerror=function(){
                         this.src='${CONFIG.imagesDir}${slugS}.png';
                         this.onerror=function(){
                             this.src='${CONFIG.imagesDir}${slugS}.jpg';
                             this.onerror=function(){
                                 this.outerHTML='<span class=marca-inicial>${marca.charAt(0)}</span>';
                             };
                         };
                     };"
            alt="${marca}" title="${marca}">`;

        return `<button class="marca-btn${ativo}" onclick="selecionarMarca('${marca.replace(/'/g,"\\'")}')">
            ${imgHtml}
        </button>`;
    }).join('');
}

function selecionarMarca(marca) {
    MARCA_ATIVA = marca || null;
    // Chip de filtro
    const chip = document.getElementById('filtro-chip');
    if (MARCA_ATIVA) {
        chip.classList.add('show');
        document.getElementById('filtro-nome').textContent = '🏷 ' + MARCA_ATIVA;
    } else {
        chip.classList.remove('show');
    }
    fecharMarcas();
    renderLoja();
    window.scrollTo(0, 0);
}

// ══════════════════════════════
// RENDER LOJA
// ══════════════════════════════
function renderLoja() {
    const container = document.getElementById('loja-container');
    container.innerHTML = '';

    let produtos = DADOS;
    if (MARCA_ATIVA) produtos = produtos.filter(p => (p.marca||'').trim() === MARCA_ATIVA);
    if (BUSCA) {
        const q = BUSCA.toLowerCase();
        produtos = produtos.filter(p =>
            (p.nome||'').toLowerCase().includes(q) ||
            (p.marca||'').toLowerCase().includes(q) ||
            (p.familia||'').toLowerCase().includes(q) ||
            String(p.id||'').includes(q)
        );
    }

    const semRes = document.getElementById('sem-res');
    if (!produtos.length) { semRes.classList.add('show'); return; }
    semRes.classList.remove('show');

    // Agrupar por família
    const fams = {};
    produtos.forEach(p => {
        const f = p.familia || 'Outros';
        if (!fams[f]) fams[f] = [];
        fams[f].push(p);
    });

    container.innerHTML = Object.entries(fams).map(([fam, prods]) => {
        const aberto = FAM_EST[fam] !== false;
        const k = '_' + fam.replace(/\W/g,'').substring(0,12);
        const cards = prods.map(p => {
            const qty = CART[p.id] ? CART[p.id].qty : 0;
            const src = imgSrc(p);
            return `<div class="card-pro" onclick="abrirModal('${String(p.id).replace(/'/g,"\\'")}')">
                <div class="b-qty${qty>0?' show':''}" id="bq-${p.id}">${qty}</div>
                ${src
                    ? `<img class="card-pro-img" src="${src}" loading="lazy"
                            onerror="this.outerHTML='<div class=\\'card-pro-img ph\\'>📦</div>'">`
                    : `<div class="card-pro-img ph">📦</div>`}
                <div class="card-pro-nome">${p.nome}</div>
                <div class="card-pro-preco">${fmt(p.preco)}</div>
                <div class="card-pro-un">${p.un||''}</div>
            </div>`;
        }).join('');

        return `<div class="fam-header" onclick="toggleFam('${fam.replace(/'/g,"\\'")}','${k}')">
            <span>${fam}</span>
            <span class="fam-arrow${aberto?' open':''}" id="fa${k}">▾</span>
        </div>
        <div class="fam-grid${aberto?'':' hidden'}" id="fg${k}">${cards}</div>`;
    }).join('');
}

function imgSrc(p) {
    if (p.img)  return CONFIG.imagesDir + p.img;
    if (p.id)   return CONFIG.imagesDir + p.id + '.jpg';
    return '';
}

function toggleFam(fam, k) {
    FAM_EST[fam] = FAM_EST[fam] === false;
    const aberto = FAM_EST[fam] !== false;
    document.getElementById('fg'+k).classList.toggle('hidden', !aberto);
    document.getElementById('fa'+k).classList.toggle('open', aberto);
}

function fmt(v) {
    if (v === undefined || v === null || v === '') return '—';
    return parseFloat(v).toFixed(2).replace('.', ',') + ' €';
}

// ══════════════════════════════
// PESQUISA
// ══════════════════════════════
let _deb;
function filtrarProdutos(val) {
    BUSCA = val.trim();
    document.getElementById('btn-clear').style.display = BUSCA ? 'block' : 'none';
    clearTimeout(_deb);
    _deb = setTimeout(renderLoja, 180);
}
function limparPesquisa() {
    document.getElementById('in-busca').value = '';
    BUSCA = '';
    document.getElementById('btn-clear').style.display = 'none';
    renderLoja();
}

// ══════════════════════════════
// MODAL QUANTIDADE
// ══════════════════════════════
function abrirModal(id) {
    const p = DADOS.find(x => String(x.id) === String(id));
    if (!p) return;
    PROD_MODAL = p;
    const qty = CART[id] ? CART[id].qty : 1;
    document.getElementById('modal-nome').textContent = p.nome;
    document.getElementById('modal-preco').textContent = fmt(p.preco) + (p.un ? ' / ' + p.un : '');
    document.getElementById('qty-input').value = qty;
    const im = document.getElementById('modal-img');
    const src = imgSrc(p);
    if (src) { im.src = src; im.style.display = 'block'; } else { im.style.display = 'none'; }
    im.onerror = () => { im.style.display = 'none'; };
    document.getElementById('btn-remove-item').style.display = CART[id] ? 'block' : 'none';
    document.getElementById('modal-qty').classList.add('open');
}
function fecharModal() { document.getElementById('modal-qty').classList.remove('open'); PROD_MODAL = null; }
function ajustarQty(d) {
    const inp = document.getElementById('qty-input');
    inp.value = Math.max(1, parseInt(inp.value||1) + d);
}
function confirmarQty() {
    if (!PROD_MODAL) return;
    const qty = Math.max(1, parseInt(document.getElementById('qty-input').value)||1);
    const p = PROD_MODAL;
    CART[p.id] = { nome: p.nome, preco: p.preco, un: p.un, img: imgSrc(p), qty };
    fecharModal(); atualizarUI();
    showToast(qty + 'x ' + p.nome + ' adicionado');
}
function removerItem() {
    if (!PROD_MODAL) return;
    delete CART[PROD_MODAL.id];
    fecharModal(); atualizarUI(); renderCartBody();
    showToast('Removido do carrinho');
}

// ══════════════════════════════
// CARRINHO
// ══════════════════════════════
function abrirCarrinho()  { renderCartBody(); document.getElementById('cart-panel').classList.add('open'); }
function fecharCarrinho() { document.getElementById('cart-panel').classList.remove('open'); }

function renderCartBody() {
    const body = document.getElementById('cart-body');
    const items = Object.entries(CART);
    const tem = items.length > 0;

    if (!tem) {
        body.innerHTML = `<div class="cart-empty"><div style="font-size:56px;margin-bottom:14px">🛒</div><h3 style="font-size:16px;font-weight:700;color:var(--grey)">Carrinho vazio</h3><p style="font-size:13px;color:#B0B0B0;margin-top:6px">Adicione produtos para encomendar.</p></div>`;
    } else {
        body.innerHTML = `<div class="cart-sec">ARTIGOS SELECIONADOS</div>` +
            items.map(([id, it]) => `
            <div class="cart-item">
                <img class="ci-img" src="${it.img}" onerror="this.style.background='#f5f5f5';this.src=''">
                <div class="ci-info">
                    <div class="ci-nome">${it.nome}</div>
                    <div class="ci-preco">${fmt(it.preco)}${it.un?' / '+it.un:''}</div>
                </div>
                <div class="ci-ctrl">
                    <button class="bqs del" onclick="cqty('${id}',-1)">−</button>
                    <span class="qd">${it.qty}</span>
                    <button class="bqs" onclick="cqty('${id}',1)">+</button>
                </div>
            </div>`).join('');
    }
    const { total, n } = totais();
    document.getElementById('total-val').textContent = fmt(total);
    document.getElementById('total-items').textContent = n + ' artigo' + (n!==1?'s':'');
    document.getElementById('btn-wpp').className = 'btn-wpp' + (!tem?' btn-dis':'');
    document.getElementById('btn-eml').className = 'btn-eml' + (!tem?' btn-dis':'');
}

function cqty(id, d) {
    if (!CART[id]) return;
    const nq = CART[id].qty + d;
    if (nq <= 0) delete CART[id]; else CART[id].qty = nq;
    atualizarUI(); renderCartBody();
}

function totais() {
    let total = 0, n = 0;
    Object.values(CART).forEach(i => { total += (parseFloat(i.preco)||0)*i.qty; n += i.qty; });
    return { total, n };
}

function atualizarUI() {
    DADOS.forEach(p => {
        const b = document.getElementById('bq-' + p.id);
        if (!b) return;
        const q = CART[p.id] ? CART[p.id].qty : 0;
        b.textContent = q; b.classList.toggle('show', q > 0);
    });
    const { total, n } = totais();
    const badge = document.getElementById('cart-badge');
    badge.textContent = n; badge.style.display = n > 0 ? 'flex' : 'none';
    document.getElementById('bt-val').textContent = fmt(total);
    document.getElementById('btn-ver-cart').classList.toggle('hidden', Object.keys(CART).length === 0);
}

// ══════════════════════════════
// ENVIAR ENCOMENDA
// ══════════════════════════════
function enviar(via) {
    const nome = document.getElementById('cli-nome').value.trim();
    const tel  = document.getElementById('cli-tel').value.trim();
    const obs  = document.getElementById('cli-obs').value.trim();
    if (!nome) { showToast('⚠️ Introduza o seu nome'); document.getElementById('cli-nome').focus(); return; }
    const items = Object.values(CART);
    if (!items.length) return;
    const { total } = totais();
    const data = new Date().toLocaleDateString('pt-PT');
    let msg = `🛒 *ENCOMENDA ${CONFIG.nomeLoja}*\n📅 ${data}\n👤 ${nome}`;
    if (tel) msg += ` — ${tel}`;
    msg += '\n\n*ARTIGOS:*\n';
    items.forEach(i => msg += `• ${i.qty}x ${i.nome} — ${fmt((parseFloat(i.preco)||0)*i.qty)}\n`);
    msg += `\n*TOTAL: ${fmt(total)}*`;
    if (obs) msg += `\n\n📝 ${obs}`;

    if (via === 'wpp') {
        window.open(`https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent(msg)}`, '_blank');
    } else {
        const subj = `Encomenda ${CONFIG.nomeLoja} — ${nome}`;
        window.open(`mailto:${CONFIG.email}?subject=${encodeURIComponent(subj)}&body=${encodeURIComponent(msg)}`, '_blank');
    }
    setTimeout(() => {
        document.getElementById('cart-panel').classList.remove('open');
        document.getElementById('success-screen').classList.add('open');
    }, 400);
}

function novaEncomenda() {
    CART = {};
    ['cli-nome','cli-tel','cli-obs'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('success-screen').classList.remove('open');
    atualizarUI(); renderLoja();
}

// ══════════════════════════════
// UTILS
// ══════════════════════════════
function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2200);
}
document.getElementById('modal-qty').addEventListener('click', e => { if(e.target===e.currentTarget) fecharModal(); });
document.addEventListener('keydown', e => { if(e.key==='Escape') { fecharModal(); fecharMarcas(); fecharCarrinho(); } });

// ── INIT ──
carregarProdutos();
</script>
</body>
</html>
