<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#E60000">
<title>DUMELHOR — Separação de Encomendas</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#E60000; --primary-d:#B30000; --deep:#1A1A1A; --grey:#333333;
  --muted:#666666; --bg:#F5F5F5; --border:#E0E0E0; --verde:#16a34a; --vermelho:#E60000; --laranja:#FF8C00;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);font-family:'Montserrat',sans-serif;color:var(--grey);
  -webkit-tap-highlight-color:transparent; touch-action:manipulation; overflow-x:hidden;}
.screen{display:none;min-height:100vh;}
.screen.active{display:block;}

/* ---------- M1 : MENU PRINCIPAL ---------- */
#m1{background:linear-gradient(160deg,#1A1A1A 0%,#1A1A1A 60%,#1A1A1A 100%); min-height:100vh;
  display:flex; flex-direction:column; align-items:center; justify-content:center; padding:30px 20px;}
#m1 img#logo{width:150px;height:150px;object-fit:contain;margin-bottom:6px;display:block;}
#m1 img#logo.hidden{display:none;}
.m1-empresa{font-size:24px;font-weight:900;color:#fff;text-align:center;letter-spacing:0.4px;margin-top:4px;}
.m1-sub{font-size:13px;font-weight:600;color:#FF8C8C;text-align:center;margin-top:6px;letter-spacing:1.5px;text-transform:uppercase;}
.m1-quadrados{display:flex;gap:22px;margin-top:46px;flex-wrap:wrap;justify-content:center;}
.m1-quadrado{width:170px;height:170px;border-radius:22px;border:none;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  box-shadow:0 8px 24px rgba(0,0,0,0.35); transition:transform .12s;}
.m1-quadrado:active{transform:scale(0.96);}
.m1-quadrado .ic{font-size:46px;}
.m1-quadrado .lbl{font-size:14px;font-weight:800;color:#fff;letter-spacing:0.5px;}
.q-encomendas{background:linear-gradient(145deg,var(--primary),var(--primary-d));}
.q-pagamentos{background:linear-gradient(145deg,#2b2b2b,#111);border:1px solid #444;}
.m1-footer{margin-top:50px;font-size:10px;color:#777;letter-spacing:1px;}

/* ---------- BARRA SUPERIOR ---------- */
.topbar{position:sticky;top:0;z-index:20;background:var(--deep);color:#fff;display:flex;align-items:center;
  gap:10px;padding:12px 12px;box-shadow:0 2px 8px rgba(0,0,0,0.2);}
.topbar .voltar{background:none;border:none;color:#fff;font-size:20px;cursor:pointer;padding:4px 8px;}
.topbar h2{margin:0;font-size:15px;font-weight:800;flex:1;letter-spacing:0.3px;}
.topbar button.act{background:rgba(255,255,255,0.12);border:none;color:#fff;padding:8px 12px;border-radius:8px;
  font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap;}

/* ---------- LISTA DE ENCOMENDAS ---------- */
#lista-encomendas{padding:12px;}
.enc-card{background:#fff;border-radius:14px;padding:14px;margin-bottom:10px;box-shadow:0 1px 6px rgba(0,0,0,0.08);
  border-left:6px solid var(--border); display:flex; align-items:center; gap:10px; cursor:pointer;}
.enc-card .dot{width:14px;height:14px;border-radius:50%;flex-shrink:0;}
.enc-info{flex:1;}
.enc-info b{font-size:14px;color:var(--deep);}
.enc-info .meta{font-size:11px;color:var(--muted);margin-top:3px;}
.enc-card .apagar{background:none;border:none;color:#c00;font-size:18px;cursor:pointer;padding:6px;}
.vazio-msg{text-align:center;color:var(--muted);font-size:13px;padding:60px 20px;}
.btn-importar-grande{display:block;margin:14px;background:var(--primary);color:#fff;border:none;border-radius:12px;
  padding:16px;font-size:14px;font-weight:800;text-align:center;cursor:pointer;box-shadow:0 3px 10px rgba(230,0,0,0.3);}

/* ---------- SEPARAÇÃO ---------- */
#filtro-btn{display:flex;align-items:center;gap:6px;}
#filtro-btn .fdot{width:10px;height:10px;border-radius:50%;background:#999;}
.grid-produtos{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:12px;}
@media(max-width:700px){.grid-produtos{grid-template-columns:repeat(2,1fr);}}
.prod-card{background:#fff;border-radius:14px;padding:12px 8px;text-align:center;border:3px solid var(--border);
  position:relative;cursor:pointer;user-select:none;box-shadow:0 1px 4px rgba(0,0,0,0.06);}
.prod-card[data-status="verde"]{border-color:var(--verde);}
.prod-card[data-status="vermelho"]{border-color:var(--vermelho);}
.prod-card[data-status="laranja"]{border-color:var(--laranja);}
.prod-card .codigo{font-size:10px;color:var(--muted);font-weight:700;}
.prod-card .nome{font-size:12px;font-weight:700;color:var(--deep);margin:5px 0 6px;line-height:1.25;min-height:30px;}
.prod-card .qtd{font-size:20px;font-weight:900;color:var(--deep);}
.prod-card .qtd small{font-size:10px;font-weight:600;color:var(--muted);}
.badge-estado{position:absolute;top:6px;right:6px;width:24px;height:24px;border-radius:50%;display:none;
  align-items:center;justify-content:center;font-size:14px;font-weight:900;color:#fff;}
.badge-estado.verde{display:flex;background:var(--verde);}
.badge-estado.vermelho{display:flex;background:var(--vermelho);}
.badge-estado.laranja{display:flex;background:var(--laranja);}
.qtd-sep-input{width:44px;margin-top:6px;padding:4px;border-radius:6px;border:1px solid var(--laranja);
  text-align:center;font-weight:800;font-size:12px;}
.fam-header{grid-column:1/-1;background:var(--deep);color:#fff;font-size:12px;font-weight:800;padding:8px 12px;
  border-radius:8px;margin-top:6px;}

/* ---------- IMPRESSÃO ---------- */
#print-area{display:none;}
@media print{
  body *{visibility:hidden;}
  #print-area, #print-area *{visibility:visible;}
  #print-area{display:block !important;position:absolute;top:0;left:0;width:100%;padding:10px;}
}
</style>
</head>
<body>

<!-- ================= M1 — MENU PRINCIPAL ================= -->
<div id="m1" class="screen active">
  <img id="logo" src="./logo.png" onerror="this.classList.add('hidden')">
  <div class="m1-empresa">DUMELHOR Representações Lda.</div>
  <div class="m1-sub">Sistema de Vendas e Pagamentos</div>
  <div class="m1-quadrados">
    <button class="m1-quadrado q-encomendas" onclick="abrirLista()">
      <div class="ic">📦</div>
      <div class="lbl">ENCOMENDAS</div>
    </button>
    <button class="m1-quadrado q-pagamentos" onclick="abrirPagamentos()">
      <div class="ic">💳</div>
      <div class="lbl">PAGAMENTOS</div>
    </button>
  </div>
  <div class="m1-footer">Tablet de separação · uso interno</div>
</div>

<!-- ================= LISTA DE ENCOMENDAS ================= -->
<div id="tela-lista" class="screen">
  <div class="topbar">
    <button class="voltar" onclick="irM1()">←</button>
    <h2>Encomendas</h2>
    <button class="act" onclick="document.getElementById('f-import').click()">📥 Importar</button>
  </div>
  <input type="file" id="f-import" accept=".json" multiple style="display:none">
  <button class="btn-importar-grande" onclick="document.getElementById('f-import').click()">📥 Importar ficheiro(s) de encomendas</button>
  <div id="lista-encomendas"></div>
</div>

<!-- ================= SEPARAÇÃO DE ENCOMENDA ================= -->
<div id="tela-sep" class="screen">
  <div class="topbar">
    <button class="voltar" onclick="abrirLista()">←</button>
    <h2 id="sep-titulo">Cliente</h2>
    <button class="act" id="filtro-btn" onclick="ciclarFiltro()"><span class="fdot"></span><span id="filtro-label">FILTRO</span></button>
    <button class="act" onclick="imprimirResumo()">🖨️</button>
  </div>
  <div id="grid-produtos" class="grid-produtos"></div>
</div>

<div id="print-area"></div>

<script>
/* =========================================================
   ESTADO / PERSISTÊNCIA
   ========================================================= */
const LS_PEDIDOS = 'DM_RESIDUAL_PEDIDOS';
const LS_SEP = id => 'DM_RESIDUAL_SEP_' + id;

function getPedidos(){ try{ return JSON.parse(localStorage.getItem(LS_PEDIDOS)) || []; }catch(e){ return []; } }
function savePedidos(lista){ localStorage.setItem(LS_PEDIDOS, JSON.stringify(lista)); }

let PEDIDO_ATUAL = null;      // encomenda aberta na tela de separação
let SEP_STATUS = {};          // { itemId: 'normal'|'verde'|'vermelho'|'laranja' }
let SEP_QTD = {};             // { itemId: qtd separada quando laranja }
let FILTRO = 'todos';
let clickTimer = {};

/* =========================================================
   NAVEGAÇÃO
   ========================================================= */
function mostrarTela(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
function irM1(){ mostrarTela('m1'); }
function abrirLista(){ renderLista(); mostrarTela('tela-lista'); }
function abrirPagamentos(){ window.open('https://orbitapurificante-design.github.io/SCANNER/index', '_blank'); }

/* =========================================================
   IMPORTAÇÃO DE FICHEIROS
   ========================================================= */
document.getElementById('f-import').addEventListener('change', function(e){
  const files = Array.from(e.target.files || []);
  if(!files.length) return;
  let processados = 0, novas = 0;
  files.forEach(file=>{
    const reader = new FileReader();
    reader.onload = ev=>{
      processados++;
      try{
        const dados = JSON.parse(ev.target.result);
        novas += importarPacote(dados);
      }catch(err){
        alert('❌ Ficheiro inválido: ' + file.name);
      }
      if(processados === files.length){
        renderLista();
        alert('✅ Importação concluída. ' + novas + ' encomenda(s) adicionada(s)/atualizada(s).');
      }
    };
    reader.readAsText(file);
  });
  e.target.value = '';
});

// Aceita tanto o pacote leve (tipo: dumelhor_encomendas) como um backup completo (tem .pedidos)
function importarPacote(dados){
  let novasEncomendas = [];
  if(dados && dados.tipo === 'dumelhor_encomendas' && Array.isArray(dados.encomendas)){
    novasEncomendas = dados.encomendas.map(en => ({...en, vendedor: dados.vendedor || ''}));
  } else if(dados && Array.isArray(dados.pedidos)){
    novasEncomendas = dados.pedidos.map(p => ({
      id: p.id, data: p.data, dataISO: p.dataISO, obs: p.obs || '',
      cliente: p.cliente, vendedor: (dados.config && dados.config.vendedor) || '',
      itens: Object.values(p.itens || {}).map(it=>({id:it.id, codigo:it.codigo||'', nome:it.nome, cat:it.cat||'', preco:it.preco||0, q:it.q}))
    }));
  } else {
    return 0;
  }

  const atuais = getPedidos();
  novasEncomendas.forEach(nova => {
    const idx = atuais.findIndex(p => p.id === nova.id);
    if(idx >= 0) atuais[idx] = nova; else atuais.unshift(nova);
  });
  savePedidos(atuais);
  return novasEncomendas.length;
}

/* =========================================================
   LISTA DE ENCOMENDAS
   ========================================================= */
function estadoGeralEncomenda(pedido){
  const sep = JSON.parse(localStorage.getItem(LS_SEP(pedido.id)) || '{"status":{}}');
  const vals = Object.values(sep.status || {});
  if(!vals.length) return null;
  if(vals.includes('vermelho')) return 'vermelho';
  if(vals.includes('laranja')) return 'laranja';
  if(vals.every(v => v === 'verde') && vals.length === pedido.itens.length) return 'verde';
  return null;
}

function renderLista(){
  const pedidos = getPedidos();
  const cont = document.getElementById('lista-encomendas');
  if(!pedidos.length){
    cont.innerHTML = '<div class="vazio-msg">Ainda não há encomendas importadas.<br>Usa "Importar" para carregar os ficheiros enviados pelos vendedores.</div>';
    return;
  }
  const cores = {verde:'#16a34a', vermelho:'#E60000', laranja:'#FF8C00'};
  cont.innerHTML = pedidos.map(p=>{
    const estado = estadoGeralEncomenda(p);
    const cor = estado ? cores[estado] : '#B0B0B0';
    const nItens = (p.itens||[]).length;
    const dataTxt = p.data || (p.dataISO ? new Date(p.dataISO).toLocaleDateString('pt-PT') : '');
    return `<div class="enc-card" style="border-left-color:${cor}" onclick="abrirSeparacao(${JSON.stringify(p.id)})">
      <div class="dot" style="background:${cor}"></div>
      <div class="enc-info">
        <b>${(p.cliente && p.cliente.nome) || 'Cliente'}</b>
        <div class="meta">📅 ${dataTxt} · ${nItens} produto(s) ${p.vendedor ? '· 👤 '+p.vendedor : ''}</div>
      </div>
      <button class="apagar" onclick="event.stopPropagation(); apagarEncomenda(${JSON.stringify(p.id)})">🗑️</button>
    </div>`;
  }).join('');
}

function apagarEncomenda(id){
  if(!confirm('Remover esta encomenda do tablet de separação?')) return;
  savePedidos(getPedidos().filter(p=>p.id!==id));
  localStorage.removeItem(LS_SEP(id));
  renderLista();
}

/* =========================================================
   SEPARAÇÃO DE PRODUTOS
   ========================================================= */
function abrirSeparacao(id){
  const p = getPedidos().find(x=>x.id===id);
  if(!p) return;
  PEDIDO_ATUAL = p;
  const guardado = JSON.parse(localStorage.getItem(LS_SEP(id)) || '{"status":{},"qtd":{}}');
  SEP_STATUS = guardado.status || {};
  SEP_QTD = guardado.qtd || {};
  FILTRO = 'todos';
  document.getElementById('sep-titulo').textContent = (p.cliente && p.cliente.nome) || 'Cliente';
  renderGridProdutos();
  atualizarFiltroVisual();
  mostrarTela('tela-sep');
}

function guardarSeparacao(){
  if(!PEDIDO_ATUAL) return;
  localStorage.setItem(LS_SEP(PEDIDO_ATUAL.id), JSON.stringify({status:SEP_STATUS, qtd:SEP_QTD}));
}

function renderGridProdutos(){
  const grid = document.getElementById('grid-produtos');
  const itens = [...(PEDIDO_ATUAL.itens||[])].sort((a,b)=> (a.cat||'').localeCompare(b.cat||'') || a.nome.localeCompare(b.nome));
  let html = '';
  let catAtual = null;
  itens.forEach(it=>{
    if(it.cat && it.cat !== catAtual){
      catAtual = it.cat;
      html += `<div class="fam-header">${catAtual}</div>`;
    }
    const estado = SEP_STATUS[it.id] || 'normal';
    const icone = estado==='verde'?'✓':estado==='vermelho'?'✕':estado==='laranja'?'!':'';
    html += `<div class="prod-card" data-status="${estado}" data-id="${it.id}" onclick="cliqueProduto(${it.id})">
      <div class="badge-estado ${estado!=='normal'?estado:''}">${icone}</div>
      <div class="codigo">${it.codigo||''}</div>
      <div class="nome">${it.nome}</div>
      <div class="qtd">${it.q} <small>un.</small></div>
      ${estado==='laranja' ? `<input type="number" class="qtd-sep-input" min="0" max="${it.q}" value="${SEP_QTD[it.id]??''}" onclick="event.stopPropagation()" onchange="SEP_QTD[${it.id}]=this.value; guardarSeparacao()">` : ''}
    </div>`;
  });
  grid.innerHTML = html;
  aplicarFiltroVisual();
}

function cliqueProduto(id){
  if(clickTimer[id]){
    clearTimeout(clickTimer[id]);
    clickTimer[id] = null;
    definirEstado(id, 'laranja');
  } else {
    clickTimer[id] = setTimeout(()=>{
      clickTimer[id] = null;
      const atual = SEP_STATUS[id] || 'normal';
      const proximo = atual==='normal' ? 'verde' : (atual==='verde' ? 'vermelho' : 'normal');
      definirEstado(id, proximo);
    }, 280);
  }
}

function definirEstado(id, estado){
  SEP_STATUS[id] = estado;
  guardarSeparacao();
  renderGridProdutos();
}

/* ---------- filtro (muda de cor: verde / vermelho / laranja) ---------- */
function ciclarFiltro(){
  const ordem = ['todos','verde','vermelho','laranja'];
  FILTRO = ordem[(ordem.indexOf(FILTRO)+1) % ordem.length];
  atualizarFiltroVisual();
  aplicarFiltroVisual();
}
function atualizarFiltroVisual(){
  const cores = {todos:'#999', verde:'#16a34a', vermelho:'#E60000', laranja:'#FF8C00'};
  const labels = {todos:'FILTRO', verde:'✓ SEPARADOS', vermelho:'✕ EM FALTA', laranja:'! INCOMPLETOS'};
  document.querySelector('#filtro-btn .fdot').style.background = cores[FILTRO];
  document.getElementById('filtro-label').textContent = labels[FILTRO];
  const btn = document.getElementById('filtro-btn');
  btn.style.background = FILTRO==='todos' ? 'rgba(255,255,255,0.12)' : cores[FILTRO];
}
function aplicarFiltroVisual(){
  document.querySelectorAll('.prod-card').forEach(card=>{
    const estado = card.getAttribute('data-status') || 'normal';
    card.style.display = (FILTRO==='todos' || estado===FILTRO) ? '' : 'none';
  });
  document.querySelectorAll('.fam-header').forEach(h=>{
    let sib = h.nextElementSibling, temVisivel = false;
    while(sib && !sib.classList.contains('fam-header')){
      if(sib.style.display !== 'none') temVisivel = true;
      sib = sib.nextElementSibling;
    }
    h.style.display = temVisivel ? '' : 'none';
  });
}

/* =========================================================
   IMPRESSÃO — resumo de produtos em falta (✕) e incompletos (!)
   ========================================================= */
function imprimirResumo(){
  if(!PEDIDO_ATUAL) return;
  const faltam = (PEDIDO_ATUAL.itens||[]).filter(it => SEP_STATUS[it.id]==='vermelho');
  const incompletos = (PEDIDO_ATUAL.itens||[]).filter(it => SEP_STATUS[it.id]==='laranja');
  if(!faltam.length && !incompletos.length){ alert('Não há produtos em falta ou incompletos para imprimir.'); return; }

  const linha = (it, sep) => `<tr>
      <td style="padding:6px;border:1px solid #ccc;">${it.codigo||''}</td>
      <td style="padding:6px;border:1px solid #ccc;">${it.nome}</td>
      <td style="padding:6px;border:1px solid #ccc;text-align:center;">${it.q}</td>
      <td style="padding:6px;border:1px solid #ccc;text-align:center;">${sep!==undefined && sep!=='' ? sep : '-'}</td>
    </tr>`;

  const hoje = new Date().toLocaleDateString('pt-PT');
  let html = `<div style="font-family:Arial,sans-serif;padding:10px;">
    <h2 style="margin:0 0 2px;">DUMELHOR — Resumo de Separação</h2>
    <div style="font-size:13px;color:#555;margin-bottom:10px;">Cliente: <b>${(PEDIDO_ATUAL.cliente&&PEDIDO_ATUAL.cliente.nome)||''}</b> &nbsp;|&nbsp; Data: ${hoje}</div>`;

  if(faltam.length){
    html += `<h3 style="color:#E60000;margin:14px 0 6px;">✕ EM FALTA (${faltam.length})</h3>
    <table style="border-collapse:collapse;width:100%;font-size:12px;">
      <tr style="background:#f2f2f2;"><th style="padding:6px;border:1px solid #ccc;">Código</th><th style="padding:6px;border:1px solid #ccc;">Produto</th><th style="padding:6px;border:1px solid #ccc;">Qtd. Pedida</th><th style="padding:6px;border:1px solid #ccc;">Qtd. Separada</th></tr>
      ${faltam.map(it=>linha(it, 0)).join('')}
    </table>`;
  }
  if(incompletos.length){
    html += `<h3 style="color:#FF8C00;margin:18px 0 6px;">! INCOMPLETOS (${incompletos.length})</h3>
    <table style="border-collapse:collapse;width:100%;font-size:12px;">
      <tr style="background:#f2f2f2;"><th style="padding:6px;border:1px solid #ccc;">Código</th><th style="padding:6px;border:1px solid #ccc;">Produto</th><th style="padding:6px;border:1px solid #ccc;">Qtd. Pedida</th><th style="padding:6px;border:1px solid #ccc;">Qtd. Separada</th></tr>
      ${incompletos.map(it=>linha(it, SEP_QTD[it.id])).join('')}
    </table>`;
  }
  html += '</div>';

  document.getElementById('print-area').innerHTML = html;
  window.print();
}

/* Init */
renderLista();
</script>
</body>
</html>
